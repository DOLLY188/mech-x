<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Control Systems Laboratory | MECH-X</title>

<style>
:root{
    --blue:#1261d6;
    --blue-dark:#0b2d5c;
    --blue-light:#eaf3ff;
    --blue-soft:#f4f8ff;
    --cyan:#16bde8;

    --text:#16345f;
    --muted:#607a9e;
    --border:#dbe8f7;
    --bg:#f7fbff;
    --white:#ffffff;

    --green:#168447;
    --red:#d63c3c;

    --shadow:0 8px 28px rgba(18,97,214,.07);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.6;
}

a{
    text-decoration:none;
    color:inherit;
}

button,
input,
select{
    font-family:inherit;
}


/* =========================
   HEADER
========================= */

.topbar{
    min-height:64px;
    background:white;
    border-bottom:1px solid var(--border);

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 24px;

    position:sticky;
    top:0;
    z-index:100;
}

.brand{
    display:flex;
    align-items:center;
    gap:25px;
}

.logo{
    color:var(--blue);
    font-size:28px;
    font-weight:900;
    letter-spacing:1px;
}

.brand-text{
    color:#6681a4;
    font-size:13px;
    font-weight:600;
}

.top-actions{
    display:flex;
    align-items:center;
    gap:16px;
}

.home-link{
    color:var(--blue-dark);
    font-size:14px;
    font-weight:700;
}

.back-home{
    background:var(--blue);
    color:white;
    padding:10px 17px;
    border-radius:8px;
    font-size:13px;
    font-weight:800;
}

.back-home:hover{
    background:#0e50b7;
}


/* =========================
   PAGE LAYOUT
========================= */

.layout{
    display:flex;
    min-height:calc(100vh - 64px);
}


/* =========================
   SIDEBAR
========================= */

.sidebar{
    width:230px;
    flex-shrink:0;

    background:white;
    border-right:1px solid var(--border);

    padding:18px 12px;
}

.side-link{
    display:flex;
    align-items:center;
    gap:13px;

    padding:12px 13px;
    margin-bottom:5px;

    border-radius:8px;

    color:#173d70;

    font-size:14px;
    font-weight:700;
}

.side-link:hover{
    background:var(--blue-light);
    color:var(--blue);
}

.side-link.active{
    background:var(--blue);
    color:white;
}

.icon{
    width:24px;
    text-align:center;
    font-size:17px;
}

.sidebar-box{
    margin:35px 7px 0;
    padding:18px 14px;

    border-radius:8px;

    background:linear-gradient(
        135deg,
        #edf6ff,
        #dcecff
    );
}

.sidebar-box strong{
    color:var(--blue);
    display:block;
    margin-bottom:7px;
}

.sidebar-box span{
    color:#6685ae;
    font-size:11px;
}


/* =========================
   MAIN
========================= */

.content{
    flex:1;
    min-width:0;
}


/* =========================
   HERO
========================= */

.hero{
    padding:35px 32px;

    border-bottom:1px solid var(--border);

    background:
        radial-gradient(
            circle at 90% 30%,
            rgba(70,150,255,.15),
            transparent 28%
        ),
        linear-gradient(
            120deg,
            #f9fcff,
            #edf6ff
        );
}

.hero-badge{
    display:inline-block;

    padding:6px 12px;

    border-radius:7px;

    background:#e2efff;

    color:var(--blue);

    font-size:12px;
    font-weight:900;
    letter-spacing:1px;

    margin-bottom:12px;
}

.hero h1{
    color:var(--blue-dark);

    font-size:clamp(36px,5vw,55px);

    line-height:1.05;

    letter-spacing:-1.5px;

    margin-bottom:12px;
}

.hero p{
    max-width:760px;

    color:#5879a7;

    font-size:16px;

    line-height:1.6;
}


/* =========================
   LAB CONTENT
========================= */

.lab-content{
    padding:25px;
}


/* =========================
   CARDS
========================= */

.tool-grid{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:22px;
}

.tool-card{
    background:white;

    border:1px solid var(--border);

    border-radius:10px;

    padding:25px;

    box-shadow:var(--shadow);
}

.tool-card h2{
    color:var(--blue-dark);

    font-size:21px;

    margin-bottom:6px;
}

.tool-description{
    color:var(--muted);

    font-size:13px;

    margin-bottom:20px;
}


/* =========================
   INPUTS
========================= */

.input-grid{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:14px;
}

.input-group{
    display:flex;
    flex-direction:column;
}

.input-group label{
    color:#466486;

    font-size:12px;

    font-weight:800;

    margin-bottom:6px;
}

.input-group input,
.input-group select{
    width:100%;

    padding:11px 12px;

    border:1px solid #cad9ea;

    border-radius:7px;

    background:white;

    color:#17385f;

    font-size:14px;

    outline:none;
}

.input-group input:focus,
.input-group select:focus{
    border-color:var(--blue);

    box-shadow:
        0 0 0 3px rgba(18,97,214,.09);
}


/* =========================
   BUTTONS
========================= */

.button-row{
    display:flex;

    flex-wrap:wrap;

    gap:10px;

    margin-top:19px;
}

.primary-btn,
.secondary-btn{
    border:none;

    border-radius:7px;

    padding:11px 18px;

    font-size:13px;

    font-weight:800;

    cursor:pointer;
}

.primary-btn{
    background:var(--blue);
    color:white;
}

.primary-btn:hover

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MECH-X | Interactive Mechatronics Engineering Laboratory</title>

    <meta name="description"
          content="MECH-X is an interactive engineering laboratory for mechatronics, mechanical, electrical, robotics, control systems and automotive engineering.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --blue: #1261d6;
            --blue-dark: #0b2d5c;
            --blue-light: #eaf3ff;
            --blue-soft: #f3f8ff;
            --cyan: #16a9e8;

            --white: #ffffff;
            --background: #f7faff;

            --text: #172033;
            --muted: #61708a;

            --border: #d9e5f3;

            --shadow:
                0 10px 30px rgba(18, 97, 214, 0.10);

            --shadow-hover:
                0 18px 40px rgba(18, 97, 214, 0.16);
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--background);
            color: var(--text);
            line-height: 1.6;
        }

        /* =========================
           NAVIGATION
        ========================== */

        nav {
            position: sticky;
            top: 0;
            z-index: 1000;

            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);

            border-bottom: 1px solid var(--border);
        }

        .nav-container {
            max-width: 1200px;
            margin: auto;

            padding: 18px 25px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 1.45rem;
            font-weight: 800;
            color: var(--blue-dark);
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--blue);
        }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--muted);
            font-weight: 600;
            transition: 0.2s;
        }

        .nav-links a:hover {
            color: var(--blue);
        }

        /* =========================
           HERO
        ========================== */

        .hero {
            min-height: 650px;

            display: flex;
            align-items: center;

            background:
                radial-gradient(
                    circle at 85% 20%,
                    #d9edff 0%,
                    transparent 32%
                ),
                radial-gradient(
                    circle at 10% 80%,
                    #e9f4ff 0%,
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #ffffff,
                    #eef6ff
                );

            border-bottom: 1px solid var(--border);
        }

        .hero-container {
            max-width: 1200px;
            width: 100%;

            margin: auto;
            padding: 80px 25px;

            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 60px;
            align-items: center;
        }

        .hero-label {
            display: inline-block;

            padding: 8px 14px;
            margin-bottom: 20px;

            background: var(--blue-light);
            color: var(--blue);

            border: 1px solid #c8def8;
            border-radius: 30px;

            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .hero h1 {
            font-size: clamp(3rem, 7vw, 5.5rem);
            line-height: 0.95;

            color: var(--blue-dark);

            margin-bottom: 25px;
        }

        .hero h1 span {
            color: var(--blue);
        }

        .hero h2 {
            font-size: 1.5rem;
            color: #29466d;
            margin-bottom: 20px;
        }

        .hero p {
            max-width: 650px;

            font-size: 1.08rem;
            color: var(--muted);

            margin-bottom: 30px;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;

            padding: 13px 22px;

            border-radius: 10px;

            text-decoration: none;
            font-weight: 700;

            transition: 0.25s;
        }

        .btn-primary {
            background: var(--blue);
            color: white;

            box-shadow: 0 8px 20px rgba(18, 97, 214, 0.22);
        }

        .btn-primary:hover {
            background: #0b4eae;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: white;
            color: var(--blue-dark);

            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--blue);
            color: var(--blue);
            transform: translateY(-2px);
        }

        /* =========================
           HERO ENGINEERING PANEL
        ========================== */

        .engineering-panel {
            background: white;

            border: 1px solid var(--border);
            border-radius: 22px;

            padding: 30px;

            box-shadow: var(--shadow);

            position: relative;
            overflow: hidden;
        }

        .engineering-panel::before {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            border-radius: 50%;

            background: #e5f2ff;

            top: -80px;
            right: -60px;
        }

        .panel-title {
            font-weight: 800;
            color: var(--blue-dark);

            margin-bottom: 25px;
        }

        .system-line {
            height: 2px;
            background: var(--border);

            margin: 20px 0;

            position: relative;
        }

        .system-line::after {
            content: "";

            position: absolute;

            width: 45%;
            height: 100%;

            background: var(--blue);

            left: 0;
            top: 0;
        }

        .system-boxes {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .system-box {
            padding: 18px 10px;

            background: var(--blue-soft);

            border: 1px solid var(--border);
            border-radius: 12px;

            text-align: center;

            font-weight: 700;
            color: var(--blue-dark);
        }

        .system-box small {
            display: block;

            margin-top: 5px;

            color: var(--muted);
            font-weight: normal;
        }

        /* =========================
           STATS
        ========================== */

        .stats {
            max-width: 1100px;
            margin: -45px auto 70px;

            padding: 0 25px;

            position: relative;
            z-index: 5;
        }

        .stats-grid {
            background: white;

            border: 1px solid var(--border);
            border-radius: 18px;

            box-shadow: var(--shadow);

            display: grid;
            grid-template-columns: repeat(4, 1fr);
        }

        .stat {
            padding: 25px;
            text-align: center;

            border-right: 1px solid var(--border);
        }

        .stat:last-child {
            border-right: none;
        }

        .stat strong {
            display: block;

            font-size: 1.8rem;

            color: var(--blue);
        }

        .stat span {
            color: var(--muted);
            font-size: 0.9rem;
        }

        /* =========================
           GENERAL SECTION
        ========================== */

        section {
            padding: 80px 25px;
        }

        .section-container {
            max-width: 1200px;
            margin: auto;
        }

        .section-header {
            text-align: center;
            max-width: 750px;

            margin: 0 auto 50px;
        }

        .section-header h2 {
            font-size: 2.4rem;

            color: var(--blue-dark);

            margin-bottom: 12px;
        }

        .section-header p {
            color: var(--muted);
        }

           LABORATORIES
        ========================== */

        .labs {
            background

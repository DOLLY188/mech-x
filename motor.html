<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MECH-X | DC Motor Laboratory</title>

<style>
:root{
    --blue:#1261d6;
    --blue-dark:#0b2d5c;
    --blue-light:#eaf3ff;
    --blue-soft:#f4f8ff;
    --cyan:#10bde8;

    --text:#10233f;
    --muted:#617089;
    --border:#d9e3f0;

    --white:#ffffff;
    --bg:#f7faff;

    --success:#168447;
    --warning:#c77a00;
    --danger:#d43d3d;

    --shadow:0 10px 30px rgba(20,55,100,.08);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.5;
}

/* NAVIGATION */

nav{
    position:sticky;
    top:0;
    z-index:1000;

    background:rgba(255,255,255,.96);
    backdrop-filter:blur(12px);

    border-bottom:1px solid var(--border);
    box-shadow:0 2px 12px rgba(0,0,0,.04);
}

.nav-container{
    max-width:1400px;
    margin:auto;
    padding:15px 25px;

    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.logo{
    font-size:24px;
    font-weight:900;
    color:var(--blue-dark);
    letter-spacing:1px;
}

.logo span{
    color:var(--blue);
}

.nav-links{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.nav-links a{
    text-decoration:none;
    color:var(--text);
    font-weight:700;
    font-size:14px;

    padding:9px 13px;
    border-radius:8px;

    transition:.2s;
}

.nav-links a:hover,
.nav-links a.active{
    background:var(--blue-light);
    color:var(--blue);
}

/* HERO */

.hero{
    max-width:1400px;
    margin:30px auto 20px;
    padding:0 25px;
}

.hero-card{
    background:linear-gradient(135deg,#0b2d5c,#1261d6);
    color:white;

    border-radius:20px;
    padding:38px;

    box-shadow:var(--shadow);
}

.badge{
    display:inline-block;

    padding:7px 12px;
    border-radius:20px;

    background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.25);

    font-size:12px;
    font-weight:800;
    letter-spacing:.5px;

    margin-bottom:12px;
}

.hero h1{
    font-size:clamp(30px,5vw,52px);
    line-height:1.1;
    margin-bottom:12px;
}

.hero p{
    max-width:850px;
    color:#e6f0ff;
}

/* MAIN */

.container{
    max-width:1400px;
    margin:auto;
    padding:0 25px 50px;
}

.section{
    margin-top:22px;
}

.section-title{
    font-size:22px;
    margin-bottom:14px;
    color:var(--blue-dark);
}

/* GRID */

.grid{
    display:grid;
    grid-template-columns:repeat(12,1fr);
    gap:18px;
}

.card{
    background:var(--white);
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px;
    box-shadow:var(--shadow);
}

.span-3{grid-column:span 3;}
.span-4{grid-column:span 4;}
.span-5{grid-column:span 5;}
.span-6{grid-column:span 6;}
.span-7{grid-column:span 7;}
.span-8{grid-column:span 8;}
.span-12{grid-column:span 12;}

/* INPUTS */

.input-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.input-group{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.input-group label{
    font-size:13px;
    font-weight:800;
    color:var(--muted);
}

.input-group input,
.input-group select{
    width:100%;
    padding:11px 12px;

    border:1px solid var(--border);
    border-radius:9px;

    outline:none;
    background:#fff;
    color:var(--text);

    font-size:14px;
}

.input-group input:focus,
.input-group select:focus{
    border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(18,97,214,.1);
}

.range-group{
    margin-top:14px;
}

.range-group input{
    width:100%;
}

.range-value{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    color:var(--muted);
    font-weight:700;
}

/* BUTTONS */

.button-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:18px;
}

button{
    border:none;
    cursor:pointer;

    padding:11px 17px;
    border-radius:9px;

    font-weight:800;
    font-size:14px;

    transition:.2s;
}

button:hover{
    transform:translateY(-1px);
}

.btn-primary{
    background:var(--blue);
    color:white;
}

.btn-secondary{
    background:var(--blue-light);
    color:var(--blue);
}

.btn-danger{
    background:#ffeaea;
    color:var(--danger);
}

.btn-success{
    background:#e9f8ef;
    color:var(--success);
}

/* STATUS */

.status-box{
    display:flex;
    align-items:center;
    gap:10px;

    padding:13px;

    border-radius:10px;
    background:var(--blue-soft);

    margin-bottom:18px;

    font-weight:800;
}

.status-dot{
    width:11px;
    height:11px;
    border-radius:50%;
    background:var(--success);

    box-shadow:0 0 0 5px rgba(22,132,71,.12);
}

.status-dot.warning{
    background:var(--warning);
    box-shadow:0 0 0 5px rgba(199,122,0,.12);
}

.status-dot.danger{
    background:var(--danger);
    box-shadow:0 0 0 5px rgba(212,61,61,.12);
}

/* MOTOR */

.motor-area{
    min-height:420px;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(circle,#ffffff 0%,#edf5ff 70%);

    border:1px solid var(--border);
    border-radius:16px;

    overflow:hidden;
}

.motor{
    position:relative;

    width:260px;
    height:260px;

    border-radius:50%;

    background:
        repeating-conic-gradient(
            #b8c4d4 0deg 12deg,
            #dbe4ef 12deg 24deg
        );

    border:14px solid #65758b;

    box-shadow:
        inset 0 0 0 12px #26384e,
        0 20px 40px rgba(0,0,0,.18);
}

.motor::before{
    content:"";

    position:absolute;
    width:130px;
    height:130px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        repeating-conic-gradient(
            #1261d6 0deg 25deg,
            #f0f6ff 25deg 50deg
        );

    border:9px solid #233a58;

    animation:spin var(--motor-duration,1s) linear infinite;
    animation-play-state:paused;
}

.motor.running::before{
    animation-play-state:running;
}

.motor.stalled::before{
    animation-play-state:paused;
}

.motor-shaft{
    position:absolute;

    width:65px;
    height:65px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:#aebccc;
    border:8px solid #3b4c62;

    z-index:5;
}

.motor-label{
    position:absolute;

    left:50%;
    bottom:-55px;

    transform:translateX(-50%);

    font-size:13px;
    font-weight:900;
    color:var(--blue-dark);

    white-space:nowrap;
}

/* METRICS */

.metric-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.metric{
    padding:16px;

    background:var(--blue-soft);
    border:1px solid var(--border);

    border-radius:12px;
}

.metric-label{
    font-size:12px;
    color:var(--muted);
    font-weight:800;
    text-transform:uppercase;
}

.metric-value{
    margin-top:4px;

    font-size:25px;
    font-weight:900;

    color:var(--blue-dark);
}

.metric-unit{
    font-size:12px;
    color:var(--muted);
}

/* DIAGNOSTICS */

.diagnostic{
    border-left:5px solid var(--success);
    background:#f0fbf4;

    padding:15px;
    border-radius:9px;
}

.diagnostic.warning{
    border-color:var(--warning);
    background:#fff8e9;
}

.diagnostic.danger{
    border-color:var(--danger);
    background:#fff0f0;
}

.diagnostic-title{
    font-weight:900;
    margin-bottom:5px;
}

.diagnostic-text{
    font-size:14px;
    color:var(--muted);
}

/* FAULTS */

.fault-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.fault-option{
    display:flex;
    align-items:center;
    gap:9px;

    padding:11px;

    border:1px solid var(--border);
    border-radius:9px;

    cursor:pointer;
    font-size:13px;
    font-weight:700;
}

.fault-option:hover{
    background:var(--blue-soft);
}

/* GRAPHS */

.chart-card{
    min-height:330px;
}

.chart-title{
    font-weight:900;
    color:var(--blue-dark);
    margin-bottom:10px;
}

canvas{
    width:100%;
    height:260px;

    border:1px solid var(--border);
    border-radius:10px;
    background:#fff;
}

/* EQUATIONS */

.equation{
    padding:13px;

    background:#f8fbff;

    border:1px solid var(--border);
    border-radius:9px;

    margin-top:9px;

    font-family:monospace;
    font-weight:700;

    overflow-x:auto;
}

/* INFO */

.info-list{
    display:grid;
    gap:10px;

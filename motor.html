<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DC Motor Laboratory | MECH-X</title>

<style>
:root{
    --blue:#1261d6;
    --blue-dark:#0b2d5c;
    --blue-light:#eaf3ff;
    --blue-soft:#f4f8ff;
    --cyan:#10bde8;

    --text:#10233f;
    --muted:#617089;
    --border:#d9e3f0;

    --white:#ffffff;
    --bg:#f7faff;
    --success:#168447;
    --danger:#d43d3d;

    --shadow:0 12px 35px rgba(18,97,214,.08);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.6;
}

a{
    color:inherit;
    text-decoration:none;
}

/* ================= NAVIGATION ================= */

.navbar{
    background:#ffffff;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:100;
}

.nav-container{
    max-width:1200px;
    margin:auto;
    padding:18px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:25px;
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:2px;
    color:var(--blue);
    line-height:1;
}

.logo span{
    color:var(--blue-dark);
}

.nav-links{
    display:flex;
    gap:26px;
    align-items:center;
    overflow-x:auto;
    white-space:nowrap;
    scrollbar-width:none;
}

.nav-links::-webkit-scrollbar{
    display:none;
}

.nav-links a{
    color:#40516a;
    font-weight:600;
    font-size:15px;
    padding:8px 2px;
    transition:.2s;
}

.nav-links a:hover,
.nav-links a.active{
    color:var(--blue);
}

/* ================= HERO ================= */

.hero{
    max-width:1200px;
    margin:auto;
    padding:72px 24px 45px;
}

.eyebrow{
    color:var(--blue);
    font-size:14px;
    font-weight:800;
    letter-spacing:3px;
    text-transform:uppercase;
    margin-bottom:18px;
}

.hero h1{
    font-size:clamp(42px,7vw,72px);
    line-height:1.02;
    letter-spacing:-2px;
    max-width:800px;
    color:var(--blue-dark);
    margin-bottom:22px;
}

.hero p{
    max-width:780px;
    color:var(--muted);
    font-size:20px;
    line-height:1.55;
}

/* ================= MAIN ================= */

.main{
    max-width:1200px;
    margin:auto;
    padding:0 24px 80px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:24px;
}

.card{
    background:#ffffff;
    border:1px solid var(--border);
    border-radius:20px;
    padding:30px;
    box-shadow:var(--shadow);
}

.card h2{
    color:var(--blue-dark);
    font-size:25px;
    margin-bottom:24px;
}

.card h3{
    color:var(--blue-dark);
    margin-bottom:12px;
}

/* ================= INPUTS ================= */

.input-group{
    margin-bottom:19px;
}

.input-group label{
    display:block;
    font-size:14px;
    font-weight:700;
    color:#40516a;
    margin-bottom:7px;
}

.input-group input{
    width:100%;
    padding:14px 15px;
    border:1px solid #cbd8e8;
    border-radius:11px;
    background:#ffffff;
    color:#15263d;
    font-size:16px;
    outline:none;
    transition:.2s;
}

.input-group input:focus{
    border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(18,97,214,.10);
}

/* ================= BUTTONS ================= */

.button-row{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-top:24px;
}

button{
    border:none;
    border-radius:10px;
    padding:13px 22px;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
    transition:.2s;
}

.primary-btn{
    background:var(--blue);
    color:white;
}

    background:#0e50

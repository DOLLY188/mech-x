<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DC Motor Laboratory | MECH-X</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --blue:#1261d6;
    --blue-dark:#0b2d5c;
    --blue-light:#eaf3ff;
    --blue-soft:#f4f8ff;
    --text:#132238;
    --muted:#607089;
    --border:#d8e3f0;
    --white:#ffffff;
    --green:#16834b;
    --shadow:0 12px 35px rgba(19,54,94,.08);
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#ffffff;
    color:var(--text);
    line-height:1.6;
}

/* =========================
   NAVIGATION
========================= */

.navbar{
    width:100%;
    background:#ffffff;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:1000;
}

.nav-inner{
    max-width:1200px;
    margin:auto;
    min-height:78px;
    padding:0 24px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:25px;
}

.logo{
    text-decoration:none;
    font-weight:900;
    font-size:25px;
    letter-spacing:2px;
    color:var(--blue);
}

.nav-links{
    display:flex;
    align-items:center;
    gap:28px;
    flex-wrap:wrap;
}

.nav-links a{
    text-decoration:none;
    color:#41536d;
    font-size:15px;
    font-weight:700;
    transition:.2s;
}

.nav-links a:hover{
    color:var(--blue);
}

/* =========================
   HERO
========================= */

.hero{
    max-width:1100px;
    margin:auto;
    padding:90px 24px 55px;
}

.eyebrow{
    color:#159ed0;
    font-size:14px;
    font-weight:900;
    letter-spacing:3px;
    margin-bottom:22px;
}

.hero h1{
    font-size:clamp(44px,7vw,72px);
    line-height:1.03;
    letter-spacing:-2px;
    color:#12213a;
    max-width:850px;
    margin-bottom:25px;
}

.hero p{
    max-width:760px;
    font-size:20px;
    color:var(--muted);
    line-height:1.65;
}

/* =========================
   MAIN
========================= */

.container{
    max-width:1100px;
    margin:auto;
    padding:0 24px 80px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:24px;
}

.card{
    background:#ffffff;
    border:1px solid var(--border);
    border-radius:22px;
    padding:32px;
    box-shadow:var(--shadow);
}

.card h2{
    font-size:25px;
    margin-bottom:25px;
    color:var(--blue-dark);
}

.card h3{
    color:var(--blue-dark);
    margin-bottom:10px;
}

.card p{
    color:var(--muted);
}

/* =========================
   INPUTS
========================= */

.input-group{
    margin-bottom:20px;
}

.input-group label{
    display:block;
    font-size:15px;
    font-weight:700;
    color:#44546a;
    margin-bottom:8px;
}

.input-group input{
    width:100%;
    height:52px;
    padding:0 16px;

    border:1px solid #cbd8e8;
    border-radius:12px;

    background:#ffffff;
    color:#17253a;

    font-size:17px;
    outline:none;

    transition:.2s;
}

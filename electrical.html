<title>Electrical & Electronics Lab | MECH-X</title>

<link rel="stylesheet" href="style.css">

<style>

.calculator-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
}

.calculator-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 15px;
    padding: 22px;
    box-shadow: var(--shadow);
}

.calculator-card h3 {
    margin-top: 0;
    color: var(--blue-dark);
}

.calculator-card > p {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.5;
}

.calc-inputs {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 15px;
}

.calc-result {
    margin-top: 15px;
    padding: 15px;
    background: var(--blue-soft);
    border: 1px solid var(--border);
    border-radius: 10px;
    line-height: 1.6;
}

.calc-result strong {
    display: block;
    color: var(--blue);
    font-size: 23px;
    margin-top: 4px;
}

.formula {
    background: #f8fbff;
    border-left: 4px solid var(--blue);
    padding: 11px;
    margin-top: 12px;
    border-radius: 7px;
    font-family: Georgia, serif;
    color: var(--blue-dark);
}

.rc-section {
    margin-top: 20px;
}

.rc-canvas {
    width: 100%;
    height: 280px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: white;
}

.lab-note {
    margin-top: 20px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 15px;
    padding: 22px;
    box-shadow: var(--shadow);
}

.lab-note h2 {
    margin-top: 0;
    color: var(--blue-dark);
}

.lab-note p {
    color: var(--muted);
    line-height: 1.7;
}

@media (max-width: 800px) {

    .calculator-grid {
        grid-template-columns: 1fr;
    }

    .calc-inputs {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

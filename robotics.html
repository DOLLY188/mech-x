<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Robotics Laboratory | MECH-X</title>

/* =====================================================
   ROBOTICS PAGE
   ===================================================== */

.robotics-layout {
    display: grid;
    grid-template-columns: 340px minmax(0, 1fr);
    gap: 18px;
}

.robot-panel,
.robot-visual,
.robot-results,
.robot-note {
    background: white;
    border: 1px solid var(--border);
    border-radius: 15px;
    padding: 22px;
    box-shadow: var(--shadow);
}

.robot-panel h2,
.robot-visual h2,
.robot-results h2,
.robot-note h2 {
    margin-top: 0;
    color: var(--blue-dark);
}

.input-group {
    margin-bottom: 15px;
}

.input-group label {
    display: block;
    margin-bottom: 7px;
    font-size: 13px;
    font-weight: 700;
    color: var(--blue-dark);
}

.input-group input[type="number"] {
    width: 100%;
    box-sizing: border-box;
}

.slider-row {
    display: grid;
    grid-template-columns: 1fr 75px;
    gap: 10px;
    align-items: center;
}

.slider-row input[type="range"] {
    width: 100%;
}

.slider-value {
    background: var(--blue-soft);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    text-align: center;
    font-weight: 700;
    color: var(--blue);
}

.button-stack {
    display: grid;
    gap: 10px;
    margin-top: 18px;
}

.robot-canvas {
    width: 100%;
    height: 500px;
    display: block;
    background: #fbfdff;
    border: 1px solid var(--border);
    border-radius: 12px;
}

.result-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
}

.result-box {
    background: var(--blue-soft);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 15px;
}

.result-box span {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
}

.result-box strong {
    color: var(--blue);
    font-size: 20px;
}

.status-box {
    margin-top: 15px;
    padding: 13px;
    border-radius: 10px;
    background: var(--blue-soft);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
}

.equation {
    background: #f7faff;
    border-left: 4px solid var(--blue);
    padding: 13px;
    border-radius: 7px;
    margin: 10px 0;
    color: var(--blue-dark);
    font-family: Georgia, serif;
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mechanical Engineering Laboratory | MECH-X</title>

<style>

:root{
    --blue:#1261d6;
    --blue-dark:#0b2d5c;
    --blue-light:#eaf3ff;
    --blue-soft:#f4f8ff;
    --cyan:#16bde8;

    --text:#16345f;
    --muted:#607a9e;
    --border:#dbe8f7;
    --bg:#f7fbff;
    --white:#ffffff;

    --green:#168447;
    --red:#d63c3c;

    --shadow:0 8px 28px rgba(18,97,214,.07);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.6;
}

a{
    text-decoration:none;
    color:inherit;
}

button,
input,
select{
    font-family:inherit;
}

.topbar{
    min-height:64px;
    background:white;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    position:sticky;
    top:0;
    z-index:100;
}

.brand{
    display:flex;
    align-items:center;
    gap:25px;
}

.logo{
    color:var(--blue);
    font-size:28px;
    font-weight:900;
    letter-spacing:1px;
}

.brand-text{
    color:#6681a4;
    font-size:13px;
    font-weight:600;
}

.top-actions{
    display:flex;
    align-items:center;
    gap:16px;
}

.home-link{
    color:var(--blue-dark);
    font-size:14px;
    font-weight:700;
}

.back-home{
    background:var(--blue);
    color:white;
    padding:10px 17px;
    border-radius:8px;
    font-size:13px;
    font-weight:800;
}

.back-home:hover{
    background:#0e50b7;
}

.layout{
    display:flex;
    min-height:calc(100vh - 64px);
}

.sidebar{
    width:230px;
    flex-shrink:0;
    background:white;
    border-right:1px solid var(--border);
    padding:18px 12px;
}

.side-link{
    display:flex;
    align-items:center;
    gap:13px;
    padding:12px 13px;
    margin-bottom:5px;
    border-radius:8px;
    color:#173d70;
    font-size:14px;
    font-weight:700;
}

.side-link:hover{
    background:var(--blue-light);
    color:var(--blue);
}

.side-link.active{
    background:var(--blue);
    color:white;
}

.icon{

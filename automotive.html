<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Automotive Engineering Lab | MECH-X</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --blue: #1261d6;
    --blue-dark: #0b2d5c;
    --blue-light: #eaf3ff;
    --blue-soft: #f5f9ff;
    --text: #17324d;
    --muted: #60758a;
    --border: #d9e5f2;
    --white: #ffffff;
    --green: #138a52;
    --red: #d63b3b;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f7faff;
    color: var(--text);
    line-height: 1.6;
}

/* NAVIGATION */

nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 16px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 24px;
    font-weight: 800;
    color: var(--blue-dark);
    text-decoration: none;
}

.logo span {
    color: var(--blue);
}

.nav-links {
    display: flex;
    gap: 22px;
    flex-wrap: wrap;
}

.nav-links a {
    text-decoration: none;
    color: var(--text);
    font-weight: 600;
    font-size: 14px;
}

.nav-links a:hover {
    color: var(--blue);
}

/* HEADER */

header {
    background:
        radial-gradient(circle at top right, #dcecff 0%, transparent 35%),
        linear-gradient(135deg, #ffffff, #edf5ff);
    padding: 70px 6% 55px;
    border-bottom: 1px solid var(--border);
}

.header-content {
    max-width: 1100px;
    margin: auto;
}

.badge {
    display: inline-block;
    background: var(--blue-light);
    color: var(--blue);
    padding: 8px 14px;
    border-radius: 30px;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 18px;
}

header h1 {
    font-size: clamp(38px, 6vw, 68px);
    line-height: 1.05;
    color: var(--blue-dark);
    margin-bottom: 18px;
}

header h1 span {
    color: var(--blue);
}

header p {
    max-width: 760px;
    color: var(--muted);
    font-size: 18px;
}

/* MAIN */

.container {
    width: min(1200px, 92%);
    margin: 45px auto;
}

.section-title {
    margin-bottom: 22px;
}

.section-title h2 {
    color: var(--blue-dark);
    font-size: 30px;
}

.section-title p {
    color: var(--muted);
}

/* GRID */

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
}

/* CARD */

.card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 25px;
    box-shadow: 0 8px 25px rgba(18, 97, 214, 0.07);
}

.card h3 {
    color: var(--blue-dark);
    margin-bottom: 17px;
}

.card p {
    color: var(--muted);
    font-size: 14px;
}

/* INPUTS */

.input-group {
    margin-bottom: 15px;
}

.input-group label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 6px;
}

.input-group input,
.input-group select {
    width: 100%;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 9px;
    font-size: 15px;
    background: #fbfdff;
    color: var(--text);
}

.input-group input:focus,
.input-group select:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(18,97,214,0.1);
}

/* GEARS */

.gear-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.gear-grid input {
    width: 100%;
}

/* BUTTON */

button {
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 14px;
    background: var(--blue);
    color: white;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    margin-top: 8px;
}

button:hover {
    background: #0e50b5;
}

/* RESULTS */

.results {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-top: 25px;
}

.result-box {
    background: var(--blue-soft);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    text-align: center;
}

.result-box .label {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 5px;
}

.result-box .value {
    color: var(--blue-dark);
    font-size: 22px;
    font-weight: 800;
}

/* GRAPH */

.graph-container {
    margin-top: 25px;
}

canvas {
    width: 100%;
    height: 350px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: white;
}
